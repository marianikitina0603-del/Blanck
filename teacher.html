<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бланки ОГЭ — учитель</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f4;font-family:Arial,sans-serif;color:#222}.wrap{max-width:1180px;margin:auto;padding:22px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0001;margin-bottom:16px}h1{margin:0 0 8px}input,button{font:inherit}input{padding:10px 12px;border:1px solid #ccc;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:8px;padding:10px 14px;background:#2f5e47;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#666}.danger{background:#a9362a}.muted{color:#666;font-size:13px}.hidden{display:none!important}.filters{display:grid;grid-template-columns:1fr 180px 180px;gap:8px;margin:12px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid #e4e4e4;text-align:left;font-size:14px}th{background:#f7f7f7;position:sticky;top:0}.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.answer{border:1px solid #ddd;border-radius:8px;padding:8px;background:#fafafa}.answer b{display:inline-block;width:24px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modalbox{background:white;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:18px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.close{background:#666}.blank{font-family:"Times New Roman",serif;border:2px solid #222;padding:18px;margin-top:12px}.blank h2{text-align:center;margin:0 0 6px}.student{border-top:2px solid #222;border-bottom:2px solid #222;padding:8px 0;margin:8px 0}.cellsline{font-family:monospace;letter-spacing:2px}.pill{display:inline-block;background:#eef4f0;border-radius:999px;padding:4px 8px;font-size:12px}@media(max-width:700px){.filters{grid-template-columns:1fr}.answers{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="card"><h1>Работы учеников</h1><div class="muted">Страница учителя. Просмотр доступен только после входа в Supabase Auth.</div><div id="configWarning" class="muted hidden" style="color:#a33;margin-top:8px">База ещё не подключена: заполните config.js.</div></div><div id="loginCard" class="card"><h3>Вход учителя</h3><div class="row"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button></div><div id="loginMsg" class="muted" style="margin-top:8px"></div></div><div id="app" class="hidden"><div class="card"><div class="row"><button id="refreshBtn">Обновить</button><button id="logoutBtn" class="secondary">Выйти</button><span id="count" class="pill"></span></div><div class="filters"><input id="search" placeholder="Фамилия или имя"><input id="classFilter" placeholder="Класс"><input id="dateFilter" type="date"></div><div class="tablewrap"><table><thead><tr><th>Дата</th><th>Ученик</th><th>Класс</th><th>Ответов</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">Работа</h3><button class="close" onclick="closeModal()">Закрыть</button></div><div id="modalContent"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.BLANCK_CONFIG||{},configured=cfg.supabaseUrl&&!cfg.supabaseUrl.includes('PASTE_')&&cfg.supabaseAnonKey&&!cfg.supabaseAnonKey.includes('PASTE_');if(!configured)document.getElementById('configWarning').classList.remove('hidden');const db=configured?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;let rows=[];const el=id=>document.getElementById(id);function showApp(on){el('loginCard').classList.toggle('hidden',on);el('app').classList.toggle('hidden',!on)}async function init(){if(!configured)return;const {data}=await db.auth.getSession();showApp(!!data.session);if(data.session)load()}el('loginBtn').onclick=async()=>{if(!db)return;el('loginMsg').textContent='Вход…';const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error){el('loginMsg').textContent=error.message;return}el('loginMsg').textContent='';showApp(true);load()};el('logoutBtn').onclick=async()=>{await db.auth.signOut();showApp(false)};el('refreshBtn').onclick=load;async function load(){el('tbody').innerHTML='<tr><td colspan="5">Загрузка…</td></tr>';const {data,error}=await db.from('submissions').select('*').order('created_at',{ascending:false}).limit(1000);if(error){el('tbody').innerHTML=`<tr><td colspan="5">${esc(error.message)}</td></tr>`;return}rows=data||[];render()}function render(){const q=el('search').value.trim().toLowerCase(),cl=el('classFilter').value.trim().toLowerCase(),dt=el('dateFilter').value;const filtered=rows.filter(r=>{const nm=`${r.student_surname} ${r.student_name} ${r.student_patronymic}`.toLowerCase();const localDate=new Date(r.created_at).toLocaleDateString('sv-SE');return(!q||nm.includes(q))&&(!cl||(r.student_class||'').toLowerCase().includes(cl))&&(!dt||localDate===dt)});el('count').textContent=`Работ: ${filtered.length}`;el('tbody').innerHTML=filtered.map(r=>{const filled=Object.values(r.answers||{}).filter(Boolean).length;return`<tr><td>${new Date(r.created_at).toLocaleString('ru-RU')}</td><td><b>${esc(r.student_surname)} ${esc(r.student_name)}</b></td><td>${esc(r.student_class)}</td><td>${filled}/19</td><td><button onclick="openWork('${r.id}')">Просмотреть</button></td></tr>`}).join('')||'<tr><td colspan="5">Работ не найдено</td></tr>'}['search','classFilter','dateFilter'].forEach(id=>el(id).addEventListener('input',render));function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function boxText(s){return String(s||'').split('').map(x=>`[${esc(x)}]`).join(' ')}window.openWork=id=>{const r=rows.find(x=>x.id===id);if(!r)return;el('modalTitle').textContent=`${r.student_surname} ${r.student_name} — ${r.student_class}`;const answers=Array.from({length:19},(_,i)=>{const n=i+1,a=r.answers?.[n]||'';return`<div class="answer"><b>${n}</b> ${a?boxText(a):'<span class="muted">пусто</span>'}</div>`}).join('');const repl=(r.replacements||[]).map(x=>`<div>${esc(x.number)} → ${esc(x.answer)}</div>`).join('')||'<span class="muted">Нет</span>';el('modalContent').innerHTML=`<div class="blank"><h2>БЛАНК ОТВЕТОВ № 1</h2><div class="student"><b>Фамилия:</b> ${esc(r.student_surname)}<br><b>Имя:</b> ${esc(r.student_name)}<br><b>Отчество:</b> ${esc(r.student_patronymic)}<br><b>Класс:</b> ${esc(r.student_class)} &nbsp; <b>Код региона:</b> ${esc(r.region_code)} &nbsp; <b>Код школы:</b> ${esc(r.school_code)}</div><h3>Ответы 1–19</h3><div class="answers">${answers}</div><h3>Замены</h3>${repl}<p class="muted">Отправлено: ${new Date(r.created_at).toLocaleString('ru-RU')} · ID ${r.id}</p></div><div class="row" style="margin-top:12px"><button class="danger" onclick="deleteWork('${r.id}')">Удалить работу</button></div>`;el('modal').classList.remove('hidden')};window.closeModal=()=>el('modal').classList.add('hidden');window.deleteWork=async id=>{if(!confirm('Удалить эту работу без возможности восстановления?'))return;const {error}=await db.from('submissions').delete().eq('id',id);if(error){alert(error.message);return}closeModal();load()};init();</script></body></html>
